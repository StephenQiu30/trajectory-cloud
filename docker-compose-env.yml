version: '3.8'

services:
  # Nacos 注册中心和配置中心
  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: trajectory-nacos
    restart: always
    environment:
      - MODE=standalone
      - TIME_ZONE=${TZ}
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE}
      - NACOS_AUTH_USERNAME=${NACOS_USERNAME}
      - NACOS_AUTH_PASSWORD=${NACOS_PASSWORD}
      - JVM_XMS=256m
      - JVM_XMX=256m
      - JVM_XMN=128m
      - JAVA_OPT_EXT=-XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:MaxMetaspaceSize=128m
    volumes:
      - ./docker/nacos/logs:/home/nacos/logs
      - ./docker/nacos/data:/home/nacos/data
    ports:
      - "8840:8080"
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
      - "9850:9850"
    networks:
      - trajectory-network
    deploy:
      resources:
        limits:
          memory: 512M

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: trajectory-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "${MYSQL_PORT_EXTERNAL}:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
    networks:
      - trajectory-network
    deploy:
      resources:
        limits:
          memory: 384M

  # Redis 缓存与分布式锁
  redis:
    image: redis:latest
    container_name: trajectory-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./docker/redis/data:/data
    ports:
      - "${REDIS_PORT_EXTERNAL}:6379"
    networks:
      - trajectory-network
    deploy:
      resources:
        limits:
          memory: 64M

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:4.2.3-management-alpine
    container_name: trajectory-rabbitmq
    restart: always
    hostname: trajectory-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./docker/rabbitmq/data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - trajectory-network
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  trajectory-network:
    name: trajectory-network
    driver: bridge

volumes:
  # Nacos 数据持久化
  nacos-data:
    driver: local
