version: '3.8'

services:
  # Nacos 注册中心和配置中心
  nacos:
    image: nacos/nacos-server:latest
    container_name: trajectory-nacos
    restart: always
    environment:
      - MODE=standalone
      - TIME_ZONE=${TZ}
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE}
      - NACOS_AUTH_USERNAME=${NACOS_USERNAME}
      - NACOS_AUTH_PASSWORD=${NACOS_PASSWORD}
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
      - JAVA_OPT_EXT=-XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:MaxMetaspaceSize=128m
    volumes:
      - ./docker/nacos/logs:/home/nacos/logs
      - ./docker/nacos/data:/home/nacos/data
    ports:
      - "8840:8080"
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
      - "9850:9850"
    networks:
      - trajectory-network
    deploy:
      resources:
        limits:
          memory: 1024M

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:4.2.3-management-alpine
    container_name: trajectory-rabbitmq
    restart: always
    hostname: trajectory-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./docker/rabbitmq/data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - trajectory-network
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  trajectory-network:
    name: trajectory-network
    driver: bridge

volumes:
  # Nacos 数据持久化
  nacos-data:
    driver: local
