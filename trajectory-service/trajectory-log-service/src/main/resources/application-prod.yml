# 日志服务配置 (Production)
server:
  port: 8084

spring:
  application:
    name: trajectory-log-service
  profiles:
    active: prod
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:localhost:8848}
        namespace: trajectory-cloud
        group: DEFAULT_GROUP
        username: ${SPRING_CLOUD_NACOS_USERNAME:nacos}
        password: ${SPRING_CLOUD_NACOS_PASSWORD:nacos}
      config:
        server-addr: ${SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR:localhost:8848}
        namespace: trajectory-cloud
        group: DEFAULT_GROUP
        file-extension: yml
        username: ${SPRING_CLOUD_NACOS_USERNAME:nacos}
        password: ${SPRING_CLOUD_NACOS_PASSWORD:nacos}
  config:
    import:
      - nacos:common-secret-prod.properties?group=DEFAULT_GROUP&refresh=true
      - nacos:common-web-prod.yml?group=DEFAULT_GROUP&refresh=true
      - nacos:common-cache-prod.yml?group=DEFAULT_GROUP&refresh=true
      - nacos:common-mysql-prod.yml?group=DEFAULT_GROUP&refresh=true
      - nacos:common-rabbitmq-prod.yml?group=DEFAULT_GROUP&refresh=true

# MyBatis-Plus 业务配置
mybatis-plus:
  type-aliases-package: com.trajectory.cloud.log.model.entity
