name: Deploy Trajectory Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and Push Docker Images
        # Note: In a real scenario, you would push to a registry like Docker Hub or Aliyun ACR
        # For now, we simulate building images
        run: |
          docker compose build

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        if: github.ref == 'refs/heads/main'
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /path/to/trajectory-cloud
            git pull origin main
            # Only start project services. Environment (middleware) should be started via docker-compose-env.yml if needed.
            docker compose up -d --build
