# =============================================================================
# 网关服务配置 (Production)
# =============================================================================

server:
  port: 8080

spring:
  application:
    name: trajectory-gateway
  main:
    web-application-type: reactive
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:localhost:8848}
        namespace: trajectory-cloud
        group: DEFAULT_GROUP
        username: ${SPRING_CLOUD_NACOS_USERNAME:nacos}
        password: ${SPRING_CLOUD_NACOS_PASSWORD:nacos}
      config:
        server-addr: ${SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR:localhost:8848}
        namespace: trajectory-cloud
        group: DEFAULT_GROUP
        file-extension: yml
        username: ${SPRING_CLOUD_NACOS_USERNAME:nacos}
        password: ${SPRING_CLOUD_NACOS_PASSWORD:nacos}
    gateway:
      auth:
        white-list:
          - /api/user/register
          - /api/user/login/**
          - /api/user/logout
          - /api/user/get/login
          - /api/user/email/code
          - /api/notification/page
          - /api/*/v3/api-docs/**
      server:
        webflux:
          routes:
            - id: trajectory-user-service
              uri: lb://trajectory-user-service
              predicates:
                - Path=/api/user/**

            - id: trajectory-notification-service
              uri: lb://trajectory-notification-service
              predicates:
                - Path=/api/notification/**

            - id: trajectory-ai-service
              uri: lb://trajectory-ai-service
              predicates:
                - Path=/api/ai/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "*"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

  config:
    import:
      - nacos:common-secret-prod.properties?group=DEFAULT_GROUP&refresh=true
      - nacos:common-web-prod.yml?group=DEFAULT_GROUP&refresh=true
      - nacos:common-cache-prod.yml?group=DEFAULT_GROUP&refresh=true

