# 网关服务配置
server:
  port: 8080

spring:
  application:
    name: trajectory-gateway
  profiles:
    active: default
  main:
    web-application-type: reactive
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:localhost:8848}
        namespace: trajectory-cloud
        group: DEFAULT_GROUP
        username: ${SPRING_CLOUD_NACOS_USERNAME:nacos}
        password: ${SPRING_CLOUD_NACOS_PASSWORD:nacos}
      config:
        server-addr: ${SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR:localhost:8848}
        namespace: trajectory-cloud
        group: DEFAULT_GROUP
        file-extension: yml
        username: ${SPRING_CLOUD_NACOS_USERNAME:nacos}
        password: ${SPRING_CLOUD_NACOS_PASSWORD:nacos}
    gateway:
      auth:
        white-list:
          - /api/user/register
          - /api/user/login/**
          - /api/user/logout
          - /api/user/get/login
          - /api/user/email/code
          - /api/notification/page
          - /doc.html
          - /swagger-ui/**
          - /swagger-resources/**
          - /v3/api-docs/**
          - /webjars/**
          - /api/*/v3/api-docs/**
      filter:
        request-rate-limiter:
          # 默认限流 KeyResolver（避免多 KeyResolver Bean 冲突）
          key-resolver: "#{@ipKeyResolver}"
      server:
        webflux:
          # 路由配置
          routes:
            - id: trajectory-user-service
              uri: lb://trajectory-user-service
              predicates:
                - Path=/api/user/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@ipKeyResolver}"

            - id: trajectory-websocket-service
              uri: lb://trajectory-websocket-service
              predicates:
                - Path=/api/websocket/**

            - id: trajectory-notification-service
              uri: lb://trajectory-notification-service
              predicates:
                - Path=/api/notification/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@userKeyResolver}"

            - id: trajectory-file-service
              uri: lb://trajectory-file-service
              predicates:
                - Path=/api/file/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"
            - id: trajectory-mail-service
              uri: lb://trajectory-mail-service
              predicates:
                - Path=/api/mail/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    key-resolver: "#{@ipKeyResolver}"

            - id: trajectory-ai-service
              uri: lb://trajectory-ai-service
              predicates:
                - Path=/api/ai/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    key-resolver: "#{@userKeyResolver}"

            - id: trajectory-log-service
              uri: lb://trajectory-log-service
              predicates:
                - Path=/api/log/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"

          # 全局跨域配置
          globalcors:
            cors-configurations:
              '[/**]':
                # 生产环境建议配置具体域名，开发环境可使用 "*"
                # 使用 allowedOriginPatterns 而非 allowedOrigins，以支持 allowCredentials=true
                allowed-origin-patterns: "*"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600

          # 默认过滤器
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
  config:
    import:
      - nacos:common-secret.properties?group=DEFAULT_GROUP&refresh=true
      - nacos:common-web.yml?group=DEFAULT_GROUP&refresh=true
      - nacos:common-cache.yml?group=DEFAULT_GROUP&refresh=true

