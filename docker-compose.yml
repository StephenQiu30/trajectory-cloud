version: '3.8'

services:
  # Gateway 网关服务
  gateway:
    build:
      context: .
      dockerfile: trajectory-gateway/Dockerfile
    image: trajectory-gateway:latest
    container_name: trajectory-gateway
    restart: always
    ports:
      - "${GATEWAY_PORT_EXTERNAL}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_USERNAME=${NACOS_USERNAME}
      - SPRING_CLOUD_NACOS_PASSWORD=${NACOS_PASSWORD}
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - JAVA_TOOL_OPTIONS=-Xss256k -XX:MaxMetaspaceSize=128m -XX:MaxRAMPercentage=60.0 -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Dnacos.logging.default.config.enabled=false
    deploy:
      resources:
        limits:
          memory: 448M
    networks:
      - trajectory-network

  # User 用户服务
  user-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-user-service/Dockerfile
    image: trajectory-user-service:latest
    container_name: trajectory-user-service
    restart: always
    ports:
      - "${USER_SERVICE_PORT_EXTERNAL}:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_USERNAME=${NACOS_USERNAME}
      - SPRING_CLOUD_NACOS_PASSWORD=${NACOS_PASSWORD}
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - JAVA_TOOL_OPTIONS=-Xss256k -XX:MaxMetaspaceSize=128m -XX:MaxRAMPercentage=60.0 -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Dnacos.logging.default.config.enabled=false
    deploy:
      resources:
        limits:
          memory: 448M
    networks:
      - trajectory-network

  # AI 智能化服务
  ai-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-ai-service/Dockerfile
    image: trajectory-ai-service:latest
    container_name: trajectory-ai-service
    restart: always
    ports:
      - "${AI_SERVICE_PORT_EXTERNAL}:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_USERNAME=${NACOS_USERNAME}
      - SPRING_CLOUD_NACOS_PASSWORD=${NACOS_PASSWORD}
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - JAVA_TOOL_OPTIONS=-Xss256k -XX:MaxMetaspaceSize=256m -XX:MaxRAMPercentage=75.0 -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Dnacos.logging.default.config.enabled=false
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - trajectory-network

  # File 文件服务
  file-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-file-service/Dockerfile
    image: trajectory-file-service:latest
    container_name: trajectory-file-service
    restart: always
    ports:
      - "${FILE_SERVICE_PORT_EXTERNAL}:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_USERNAME=${NACOS_USERNAME}
      - SPRING_CLOUD_NACOS_PASSWORD=${NACOS_PASSWORD}
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - JAVA_TOOL_OPTIONS=-Xss256k -XX:MaxMetaspaceSize=128m -XX:MaxRAMPercentage=60.0 -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Dnacos.logging.default.config.enabled=false
    deploy:
      resources:
        limits:
          memory: 448M
    networks:
      - trajectory-network

  # Mail 邮件服务
  mail-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-mail-service/Dockerfile
    image: trajectory-mail-service:latest
    container_name: trajectory-mail-service
    restart: always
    ports:
      - "${MAIL_SERVICE_PORT_EXTERNAL}:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_USERNAME=${NACOS_USERNAME}
      - SPRING_CLOUD_NACOS_PASSWORD=${NACOS_PASSWORD}
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - JAVA_TOOL_OPTIONS=-Xss256k -XX:MaxMetaspaceSize=128m -XX:MaxRAMPercentage=60.0 -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Dnacos.logging.default.config.enabled=false
    deploy:
      resources:
        limits:
          memory: 448M
    networks:
      - trajectory-network

  # Notification 通知服务
  notification-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-notification-service/Dockerfile
    image: trajectory-notification-service:latest
    container_name: trajectory-notification-service
    restart: always
    ports:
      - "${NOTIFICATION_SERVICE_PORT_EXTERNAL}:8082"
      - "9091:9091"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_USERNAME=${NACOS_USERNAME}
      - SPRING_CLOUD_NACOS_PASSWORD=${NACOS_PASSWORD}
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - JAVA_TOOL_OPTIONS=-Xss256k -XX:MaxMetaspaceSize=128m -XX:MaxRAMPercentage=60.0 -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Dnacos.logging.default.config.enabled=false
    deploy:
      resources:
        limits:
          memory: 448M
    networks:
      - trajectory-network

  # Log 日志服务
  log-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-log-service/Dockerfile
    image: trajectory-log-service:latest
    container_name: trajectory-log-service
    restart: always
    ports:
      - "${LOG_SERVICE_PORT_EXTERNAL}:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_USERNAME=${NACOS_USERNAME}
      - SPRING_CLOUD_NACOS_PASSWORD=${NACOS_PASSWORD}
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - JAVA_TOOL_OPTIONS=-Xss256k -XX:MaxMetaspaceSize=128m -XX:MaxRAMPercentage=60.0 -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Dnacos.logging.default.config.enabled=false
    deploy:
      resources:
        limits:
          memory: 448M
    networks:
      - trajectory-network

networks:
  trajectory-network:
    external: true
