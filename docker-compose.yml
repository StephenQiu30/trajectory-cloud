version: '3.8'

services:
  # Gateway 网关服务
  gateway:
    build:
      context: .
      dockerfile: trajectory-gateway/Dockerfile
    image: trajectory-gateway:latest
    container_name: trajectory-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
    networks:
      - trajectory-network

  # User 用户服务
  user-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-user-service/Dockerfile
    image: trajectory-user-service:latest
    container_name: trajectory-user-service
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
    networks:
      - trajectory-network

  # AI 智能化服务
  ai-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-ai-service/Dockerfile
    image: trajectory-ai-service:latest
    container_name: trajectory-ai-service
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
    networks:
      - trajectory-network

  # File 文件服务
  file-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-file-service/Dockerfile
    image: trajectory-file-service:latest
    container_name: trajectory-file-service
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
    networks:
      - trajectory-network

  # Mail 邮件服务
  mail-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-mail-service/Dockerfile
    image: trajectory-mail-service:latest
    container_name: trajectory-mail-service
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
    networks:
      - trajectory-network

  # Notification 通知服务
  notification-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-notification-service/Dockerfile
    image: trajectory-notification-service:latest
    container_name: trajectory-notification-service
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
    networks:
      - trajectory-network

  # Search 搜索服务
  search-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-search-service/Dockerfile
    image: search-service:latest
    container_name: search-service
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
    networks:
      - trajectory-network

  # Log 日志服务
  log-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-log-service/Dockerfile
    image: log-service:latest
    container_name: log-service
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
    networks:
      - trajectory-network

networks:
  trajectory-network:
    external: true
