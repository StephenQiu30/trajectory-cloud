# 2核4G 服务器：应用总内存约 2.2G，预留 ~1.8G 给系统/Nacos/MySQL/Redis/RabbitMQ 等
version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: trajectory-gateway/Dockerfile
    image: trajectory-gateway:latest
    container_name: trajectory-gateway
    restart: always
    ports:
      - "${GATEWAY_PORT_EXTERNAL}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_USERNAME=${NACOS_USERNAME}
      - SPRING_CLOUD_NACOS_PASSWORD=${NACOS_PASSWORD}
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - JAVA_TOOL_OPTIONS=-Xss256k -XX:MaxMetaspaceSize=64m -XX:MaxRAMPercentage=65 -XX:+UseSerialGC -Dnacos.logging.default.config.enabled=false
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - trajectory-network

  user-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-user-service/Dockerfile
    image: trajectory-user-service:latest
    container_name: trajectory-user-service
    restart: always
    ports:
      - "${USER_SERVICE_PORT_EXTERNAL}:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_USERNAME=${NACOS_USERNAME}
      - SPRING_CLOUD_NACOS_PASSWORD=${NACOS_PASSWORD}
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - JAVA_TOOL_OPTIONS=-Xss256k -XX:MaxMetaspaceSize=96m -XX:MaxRAMPercentage=50 -XX:+UseSerialGC -Dnacos.logging.default.config.enabled=false
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - trajectory-network

  notification-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-notification-service/Dockerfile
    image: trajectory-notification-service:latest
    container_name: trajectory-notification-service
    restart: always
    ports:
      - "${NOTIFICATION_SERVICE_PORT_EXTERNAL}:8082"
      - "9091:9091"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_USERNAME=${NACOS_USERNAME}
      - SPRING_CLOUD_NACOS_PASSWORD=${NACOS_PASSWORD}
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - JAVA_TOOL_OPTIONS=-Xss256k -XX:MaxMetaspaceSize=80m -XX:MaxRAMPercentage=55 -XX:+UseSerialGC -Dnacos.logging.default.config.enabled=false
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          memory: 192M
    networks:
      - trajectory-network

  ai-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-ai-service/Dockerfile
    image: trajectory-ai-service:latest
    container_name: trajectory-ai-service
    restart: always
    ports:
      - "${AI_SERVICE_PORT_EXTERNAL}:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_USERNAME=${NACOS_USERNAME}
      - SPRING_CLOUD_NACOS_PASSWORD=${NACOS_PASSWORD}
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - JAVA_TOOL_OPTIONS=-Xss256k -XX:MaxMetaspaceSize=96m -XX:MaxRAMPercentage=50 -XX:+UseSerialGC -Dnacos.logging.default.config.enabled=false
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - trajectory-network

networks:
  trajectory-network:
    external: true
