# 2核4G 服务器：仅部署微服务，Nacos/RabbitMQ/MySQL/Redis 在外部
version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: trajectory-gateway/Dockerfile
    image: trajectory-gateway:latest
    container_name: trajectory-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_USERNAME=${NACOS_USERNAME}
      - SPRING_CLOUD_NACOS_PASSWORD=${NACOS_PASSWORD}
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m -Xss256k -XX:MetaspaceSize=96m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC -Dnacos.logging.default.config.enabled=false
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 600M
        reservations:
          memory: 256M
    networks:
      - trajectory-network

  user-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-user-service/Dockerfile
    image: trajectory-user-service:latest
    container_name: trajectory-user-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_USERNAME=${NACOS_USERNAME}
      - SPRING_CLOUD_NACOS_PASSWORD=${NACOS_PASSWORD}
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx512m -Xss256k -XX:MetaspaceSize=96m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC -Dnacos.logging.default.config.enabled=false
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        reservations:
          memory: 384M
    networks:
      - trajectory-network

  notification-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-notification-service/Dockerfile
    image: trajectory-notification-service:latest
    container_name: trajectory-notification-service
    restart: always
    ports:
      - "8082:8082"
      - "9091:9091"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_USERNAME=${NACOS_USERNAME}
      - SPRING_CLOUD_NACOS_PASSWORD=${NACOS_PASSWORD}
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m -Xss256k -XX:MetaspaceSize=96m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC -Dnacos.logging.default.config.enabled=false
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 600M
        reservations:
          memory: 256M
    networks:
      - trajectory-network

  ai-service:
    build:
      context: .
      dockerfile: trajectory-service/trajectory-ai-service/Dockerfile
    image: trajectory-ai-service:latest
    container_name: trajectory-ai-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_HOST}:${NACOS_PORT}
      - SPRING_CLOUD_NACOS_USERNAME=${NACOS_USERNAME}
      - SPRING_CLOUD_NACOS_PASSWORD=${NACOS_PASSWORD}
      - SPRING_MAIN_LAZY_INITIALIZATION=true
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx512m -Xss256k -XX:MetaspaceSize=96m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC -Dnacos.logging.default.config.enabled=false
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        reservations:
          memory: 384M
    networks:
      - trajectory-network

networks:
  trajectory-network:
    external: true
