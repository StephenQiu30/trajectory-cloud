# 对象存储公共配置 (Default)
spring:
  config:
    activate:
      on-profile: default

# 腾讯云 COS 对象存储配置
cos:
  client:
    enable: true
    accessKey: ${dev.cos.client.accessKey}
    secretKey: ${dev.cos.client.secretKey}
    region: ${dev.cos.client.region}
    bucket: ${dev.cos.client.bucket}

# MinIO 对象存储配置
minio:
  client:
    enable: true
    endpoint: ${dev.minio.endpoint}
    accessKey: ${dev.minio.accessKey}
    secretKey: ${dev.minio.secretKey}
    bucket: ${dev.minio.bucket}

# 阿里云 OSS 对象存储配置
oss:
  client:
    enable: true
    endpoint: ${dev.aliyun.oss.endpoint}
    accessKey: ${dev.aliyun.oss.accessKey}
    secretKey: ${dev.aliyun.oss.secretKey}
    bucket: ${dev.aliyun.oss.bucket}
