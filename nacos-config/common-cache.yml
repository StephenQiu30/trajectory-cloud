# 缓存服务配置 (通用)
spring:
  data:
    redis:
      database: ${dev.redis.database}
      host: ${dev.redis.host}
      port: ${dev.redis.port}
      password: ${dev.redis.password}
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-wait: -1
          max-idle: 10
          min-idle: 5

# Caffeine 本地缓存配置
caffeine:
  enabled: true
  expired: 300
  initCapacity: 100
  maxCapacity: 10000
